[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aandd-reader"

version = "0.2.17"

description = "Python control package for A&D FX-series electronic balances, providing serial measurement and REST device-server access."
authors = [
  { name="Kengo NAKADA", email="kengo.nakada@email.com" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "xlogger-py",
    #
    "pyserial",
    "nest_asyncio",
    "pydantic",
    "pyyaml",
    "pytest",
    "sphinx",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "linkify-it-py"
]

[project.urls]
Homepage = "https://ohara-lab-su.github.io/aandd_reader/"
Documentation = "https://ohara-lab-su.github.io/aandd_reader/"
Repository = "https://github.com/ohara-lab-su/aandd_reader"
Issues = "https://github.com/ohara-lab-su/aandd_reader/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 88

[tool.isort]
profile = "black"